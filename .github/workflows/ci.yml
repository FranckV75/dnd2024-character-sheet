name: CI

on:
  push:
    branches: [ master, v4 ]
  pull_request:
    branches: [ master ]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'   # la même que sur l'ordinateur de Franck

      - name: Syntax, imports, HTML rules and unit tests
        run: npm run check
